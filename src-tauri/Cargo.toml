[package]
name = "sqlstudio"
version = "0.2.3"
description = "Modern SQL Server desktop studio"
authors = ["Mustafa Karamuklu"]
edition = "2021"

[lib]
name = "sqlstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiberius = { package = "tiberius-ng", version = "0.13.1", default-features = false, features = ["tds73", "native-tls", "winauth", "sql-browser-tokio", "chrono"] }
futures-util = "0.3"
chrono = "0.4"
tokio = { version = "1", features = ["net", "time", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
keyring = "4.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

